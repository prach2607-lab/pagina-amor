<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
}

/* Layout */
.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    padding: 40px;
}

.text-box {
    max-width: 500px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow-y: auto;
    max-height: 80vh;
    position: relative;
    z-index: 2;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 50px;
}

.menu-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff4b5c;
    color: white;
    cursor: pointer;
}

/* Carrusel */
.carousel {
    width: 400px;
    height: 75vh;
    position: relative;
    z-index: 2;
}

.carousel img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    opacity: 0;
    border-radius: 20px;
}

/* Animaciones carrusel */
.fade img { transition: opacity 1s; }
.fade img.active { opacity: 1; }

.zoom img {
    transition: opacity 1s, transform 3s;
    transform: scale(1.1);
}
.zoom img.active {
    opacity: 1;
    transform: scale(1);
}

.slide img {
    transition: opacity 1s, transform 1s;
    transform: translateX(100px);
}
.slide img.active {
    opacity: 1;
    transform: translateX(0);
}

/* Carta */
.carta-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.carta {
    width: 250px;
    height: 160px;
    background: #ff4b5c;
}

.tapa {
    width: 100%;
    height: 100%;
    background: #ff1e3c;
    transform-origin: top;
    animation: abrir 2s forwards;
}

@keyframes abrir {
    to { transform: rotateX(-180deg); }
}

/* TE AMO */
.teamo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    font-family: 'Great Vibes', cursive;
    animation: aparecer 2s forwards, latido 1s infinite 2s;
    z-index: 3;
}

@keyframes aparecer {
    to { transform: translate(-50%, -50%) scale(1); }
}
@keyframes latido {
    50% { transform: translate(-50%, -50%) scale(1.1); }
}

/* ❤️ Corazones */
.heart {
    position: fixed;
    bottom: -20px;
    color: rgba(255,255,255,0.8);
    animation: subir 5s linear infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes subir {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}
</style>
</head>

<body>

/* Carrusel */
function iniciarCarrusel() {
let i = 0;
const imgs = document.querySelectorAll(".carousel img");
setInterval(() => {
    imgs[i].classList.remove("active");
    i = (i + 1) % imgs.length;
    imgs[i].classList.add("active");
}, 3000);
}

/* ❤️ Corazones */
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}
setInterval(crearCorazon, 300);

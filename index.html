<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow-x: hidden;
    color: white;
}

/* Fondo corazones */
#hearts-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.heart {
    position: absolute;
    bottom: -30px;
    color: rgba(255,255,255,0.75);
    animation: subir 7s linear forwards;
}

@keyframes subir {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.6); opacity: 0; }
}

.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    padding: 40px;
    position: relative;
    z-index: 2;
}

.text-box {
    max-width: 500px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 20px;
    overflow-y: auto;
    max-height: 80vh;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 50px;
    text-align: center;
}

.menu-btn {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff4b5c;
    color: white;
    cursor: pointer;
    margin-right: 10px;
}

.carousel {
    width: 400px;
    height: 75vh;
    position: relative;
}

.carousel img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    opacity: 0;
    border-radius: 20px;
}

.fade img { transition: opacity 1s; }
.fade img.active { opacity: 1; }

.zoom img {
    transition: opacity 1s, transform 3s;
    transform: scale(1.1);
}
.zoom img.active {
    opacity: 1;
    transform: scale(1);
}

.slide img {
    transition: opacity 1s, transform 1s;
    transform: translateX(100px);
}
.slide img.active {
    opacity: 1;
    transform: translateX(0);
}

/* Carta */
.carta-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
}

.carta {
    width: 250px;
    height: 160px;
    background: #ff4b5c;
}

.tapa {
    width: 100%;
    height: 100%;
    background: #ff1e3c;
    transform-origin: top;
    animation: abrir 2s forwards;
}

@keyframes abrir {
    to { transform: rotateX(-180deg); }
}

/* Página 4 especial */
.gallery-wrap {
    width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.memory-card {
    opacity: 0;
    transform: translateY(40px) scale(0.95);
    animation: revealCard 1s ease forwards;
}

.memory-card:nth-child(1) { animation-delay: 0.3s; }
.memory-card:nth-child(2) { animation-delay: 0.8s; }
.memory-card:nth-child(3) { animation-delay: 1.3s; }

.memory-card img {
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

@keyframes revealCard {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Final */
.final-love {
    font-size: 100px;
    text-align: center;
    width: 100%;
    font-family: 'Great Vibes', cursive;
    animation: latido 1s infinite;
}

@keyframes latido {
    50% { transform: scale(1.1); }
}
</style>

/* Carrusel */
function iniciarCarrusel() {
let i = 0;
const imgs = document.querySelectorAll(".carousel img");
setInterval(() => {
    imgs[i].classList.remove("active");
    i = (i + 1) % imgs.length;
    imgs[i].classList.add("active");
}, 3000);
}

/* Corazones */
function crearCorazon() {
    const container = document.getElementById("hearts-container");
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 18 + 12) + "px";
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
}
setInterval(crearCorazon, 300);

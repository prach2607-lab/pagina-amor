<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
}

.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    padding: 40px;
}

.text-box {
    max-width: 500px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow-y: auto;
    max-height: 80vh;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 50px;
}

.menu-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff4b5c;
    color: white;
    cursor: pointer;
}

/* Carrusel */
.carousel {
    width: 400px;
    height: 75vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.carousel img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    opacity: 0;
    border-radius: 20px;
}

/* Animaciones */
.fade img {
    transition: opacity 1s;
}
.fade img.active {
    opacity: 1;
}

.zoom img {
    transition: opacity 1s, transform 3s;
    transform: scale(1.1);
}
.zoom img.active {
    opacity: 1;
    transform: scale(1);
}

.slide img {
    transition: opacity 1s, transform 1s;
    transform: translateX(100px);
}
.slide img.active {
    opacity: 1;
    transform: translateX(0);
}

/* Corazones */
.heart {
    position: fixed;
    bottom: -20px;
    color: red;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    100% { transform: translateY(-110vh); }
}
</style>
</head>

<body>

<div class="container" id="contenido">
    <div class="text-box">
        <h1>💌 Acceso secreto</h1>
        <input type="password" id="pass" placeholder="Contraseña">
        <br>
        <button class="menu-btn" onclick="verificar()">Entrar</button>
    </div>
</div>

<script>
function verificar() {
    let pass = document.getElementById("pass").value;
    if (pass === "Ane") {
        cargarPagina1();
    } else {
        alert("Contraseña incorrecta 😢");
    }
}

/* PAGINA 1 */
function cargarPagina1() {
    document.getElementById("contenido").innerHTML = `
    <div class="text-box">
        <h1>Para ti 💖</h1>
        <p>
        hola, mi amor, esta pagina o archivo fue hecho con el único fin de decirte que te amo demasiado mi vida.
        </p>

        <button class="menu-btn" onclick="cargarPagina2()">Ver más 💌</button>
    </div>

    <div class="carousel fade">
        <img src="foto1.jpg" class="active">
        <img src="foto2.jpg">
        <img src="foto3.jpg">
    </div>
    `;
    iniciarCarrusel();
}

/* PAGINA 2 */
function cargarPagina2() {
    document.getElementById("contenido").innerHTML = `
    <div class="text-box">
        <h1>Un poquito más 💖</h1>
        <p>
        (TU MENSAJE 2)
        </p>

        <button class="menu-btn" onclick="cargarPagina1()">Volver 🔙</button>
        <button class="menu-btn" onclick="cargarPagina3()">Ver más 2 💌</button>
    </div>

    <div class="carousel zoom">
        <img src="foto4.jpg" class="active">
        <img src="foto5.jpg">
        <img src="foto6.jpg">
    </div>
    `;
    iniciarCarrusel();
}

/* PAGINA 3 */
function cargarPagina3() {
    document.getElementById("contenido").innerHTML = `
    <div class="text-box">
        <h1>Para nosotros 💖</h1>
        <p>
        HOLAAAAA MI AMOR,<br><br>

        ¿Qué se siente ser la mujer mas bella, hermosa, guapa, preciosota, de este fucking mundo?<br>
        porque lo eres mi amor, estas pero bien guapota. brillas tanto que hasta la luna te tiene envidia.<br>
        Bueño, son cosas que ya tu sabe mi amol.<br><br>

        No solo eres hermosa mi amor también. Eres la calma que aparece cuando todo en mí hace ruido.<br>
        Aprecio todos y cada uno de los momentos que paso junto a ti mi amor, tu voz tiene algo que me desarma y me reconstruye al mismo tiempo.<br><br>

        Amo cada cosa de ti mi amor, desde tus besos, tus caricias, tus abrazos, hasta la forma de como te ríes, tus vulgaridades que se complementan conmigo, cada aspecto es especial para mi.<br><br>

        No necesito nada más, si te tengo a ti. Eres lo mejor de mi vida, me encantas hoy, mañana y todos los días que vengan.<br><br>

        Estas en todos y cada uno de mis pensamientos, tanto que mi cerebro ya se pregunta ¿cuando te vas a cansar? de dar vueltas por mi cabeza.<br><br>

        Te siento tanto, que mi corazón empezó a bombear más fuerte.<br><br>

        Eres y quiero que sigas siendo la razón de mis impulsos de cariño, que todo lo que tenga que dar sea para ti. TE AMOO ❤️<br><br>

        Gracias por existir y por quedarte conmigo.<br><br>

        ATT: tu negro 💖
        </p>

        <button class="menu-btn" onclick="cargarPagina2()">Volver 🔙</button>
    </div>

    <div class="carousel slide">
        <img src="foto7.jpg" class="active">
        <img src="foto8.jpg">
        <img src="foto9.jpg">
    </div>
    `;
    iniciarCarrusel();
}

/* Carrusel */
function iniciarCarrusel() {
    let index = 0;
    const imagenes = document.querySelectorAll(".carousel img");

    setInterval(() => {
        imagenes[index].classList.remove("active");
        index = (index + 1) % imagenes.length;
        imagenes[index].classList.add("active");
    }, 3000);
}

/* Corazones */
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
}

.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    padding: 40px;
}

.text-box {
    max-width: 500px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow-y: auto;
    max-height: 80vh;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 50px;
}

.menu-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff4b5c;
    color: white;
    cursor: pointer;
}

/* Carrusel */
.carousel {
    width: 400px;
    height: 75vh;
    position: relative;
}

.carousel img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    opacity: 0;
    border-radius: 20px;
}

/* Animaciones */
.fade img { transition: opacity 1s; }
.fade img.active { opacity: 1; }

.zoom img {
    transition: opacity 1s, transform 3s;
    transform: scale(1.1);
}
.zoom img.active {
    opacity: 1;
    transform: scale(1);
}

.slide img {
    transition: opacity 1s, transform 1s;
    transform: translateX(100px);
}
.slide img.active {
    opacity: 1;
    transform: translateX(0);
}

/* Carta */
.carta-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.carta {
    width: 250px;
    height: 160px;
    background: #ff4b5c;
    position: relative;
}

.tapa {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff1e3c;
    transform-origin: top;
    animation: abrir 2s forwards;
}

@keyframes abrir {
    to { transform: rotateX(-180deg); }
}

/* TE AMO */
.teamo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    font-family: 'Great Vibes', cursive;
    animation: aparecer 2s forwards, latido 1s infinite 2s;
}

@keyframes aparecer {
    to { transform: translate(-50%, -50%) scale(1); }
}
@keyframes latido {
    50% { transform: translate(-50%, -50%) scale(1.1); }
}
</style>
</head>

<body>

<div class="container" id="contenido">
    <div class="text-box">
        <h1>💌 Acceso secreto</h1>
        <input type="password" id="pass">
        <button class="menu-btn" onclick="verificar()">Entrar</button>
    </div>
</div>

<script>
function verificar() {
    if (document.getElementById("pass").value === "Ane") {
        animarCarta();
    }
}

/* Carta */
function animarCarta() {
    document.body.innerHTML += `
    <div class="carta-container">
        <div class="carta"><div class="tapa"></div></div>
    </div>`;
    setTimeout(() => {
        document.querySelector(".carta-container").remove();
        cargarPagina1();
    }, 2000);
}

/* PAGINA 1 */
function cargarPagina1() {
document.getElementById("contenido").innerHTML = `
<div class="text-box">
<h1>Para ti 💖</h1>
<p>
hola, mi amor, esta pagina fue hecha con el único fin de decirte que te amo demasiado 💖
</p>
<button class="menu-btn" onclick="cargarPagina2()">Ver más</button>
</div>

<div class="carousel fade">
<img src="foto1.jpg" class="active">
<img src="foto2.jpg">
<img src="foto3.jpg">
</div>
`;
iniciarCarrusel();
}

/* PAGINA 2 */

/* PAGINA 3 */
function cargarPagina3() {
document.getElementById("contenido").innerHTML = `
<div class="text-box">

<button class="menu-btn" onclick="cargarPagina2()">Volver</button>
</div>

<div class="carousel slide">

/* Carrusel */
function iniciarCarrusel() {
let i = 0;
const imgs = document.querySelectorAll(".carousel img");
setInterval(() => {
    imgs[i].classList.remove("active");
    i = (i + 1) % imgs.length;
    imgs[i].classList.add("active");
}, 3000);
}
</script>

</body>
</html>

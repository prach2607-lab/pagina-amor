<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
}

.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    padding: 40px;
}

.text-box {
    max-width: 500px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow-y: auto;
    max-height: 80vh;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 50px;
}

.menu-btn {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff4b5c;
    color: white;
    cursor: pointer;
}

/* Carrusel */
.carousel {
    width: 400px;
    height: 75vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.carousel img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    opacity: 0;
    border-radius: 20px;
}

/* Animaciones */
.fade img { transition: opacity 1s; }
.fade img.active { opacity: 1; }

.zoom img {
    transition: opacity 1s, transform 3s;
    transform: scale(1.1);
}
.zoom img.active {
    opacity: 1;
    transform: scale(1);
}

.slide img {
    transition: opacity 1s, transform 1s;
    transform: translateX(100px);
}
.slide img.active {
    opacity: 1;
    transform: translateX(0);
}

/* TE AMO gigante */
.teamo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    font-family: 'Great Vibes', cursive;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.8);
    animation: aparecer 2s ease forwards, latido 1s infinite 2s;
    z-index: 999;
}

@keyframes aparecer {
    to {
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes latido {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

/* Corazones */
.heart {
    position: fixed;
    bottom: -20px;
    color: red;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    100% { transform: translateY(-110vh); }
}
</style>
</head>

<body>

<div class="container" id="contenido">
    <div class="text-box">
        <h1>💌 Acceso secreto</h1>
        <input type="password" id="pass" placeholder="Contraseña">
        <br>
        <button class="menu-btn" onclick="verificar()">Entrar</button>
    </div>
</div>

<script>
function verificar() {
    let pass = document.getElementById("pass").value;
    if (pass === "Ane") {
        cargarPagina1();
    } else {
        alert("Contraseña incorrecta 😢");
    }
}

/* PAGINA 1 */
function cargarPagina1() {
    document.getElementById("contenido").innerHTML = `
    <div class="text-box">
        <h1>Para ti 💖</h1>
        <p>
        hola, mi amor, esta pagina o archivo, como lo quieras llamar fue hecho con el único fin de decirte que te amo demasiado mi vida. 
        Eres una chica maravillosa e incomparable, la unica en llenar mis mañanas de alegria. 
        te recuerdo que mi amor hacia a ti es incondicional, y deseo que todas nuestras metas se cumplan, 
        y quiero, deseo anhelo que las cumplamos juntos hasta el fin de nuestros dias :3
        </p>

        <button class="menu-btn" onclick="cargarPagina2()">Ver más 💌</button>
    </div>

    <div class="carousel fade">
        <img src="foto1.jpg" class="active">
        <img src="foto2.jpg">
        <img src="foto3.jpg">
    </div>
    `;
    iniciarCarrusel();
}

/* PAGINA 2 */
function cargarPagina2() {
    document.getElementById("contenido").innerHTML = `
    <div class="text-box">
        <h1>Un poquito más 💖</h1>
        <p>
        hola mi niña, ¿Cómo estas ? espero que bien, bueño, en esta pagina, esta escrita con el fin, de hacerte saber lo mucho que te extraño cada día. 
        BUENO, en si por aca quiero expresarme y decirte todo lo que siento.<br><br>

        Anelhy, ya no solo te quiero en mi vida, te necesito en ella, es inevitable, no imagino una vida sin ti.<br><br>

        quiero vivir toda mi vida contigo y seguir creando momentos felices a tu lado.
        </p>

        <button class="menu-btn" onclick="cargarPagina1()">Volver 🔙</button>
        <button class="menu-btn" onclick="cargarPagina3()">Ver más 2 💌</button>
    </div>

    <div class="carousel zoom">
        <img src="foto4.jpg" class="active">
        <img src="foto5.jpg">
        <img src="foto6.jpg">
    </div>
    `;
    iniciarCarrusel();
}

/* PAGINA 3 */
function cargarPagina3() {
    document.getElementById("contenido").innerHTML = `
    <div class="text-box">
        <h1>Para nosotros 💖</h1>
        <p>
        HOLAAAAA MI AMOR,<br><br>

        ¿Qué se siente ser la mujer mas bella, hermosa, guapa, preciosota, de este mundo?<br>
        porque lo eres mi amor, estas pero bien guapota.<br><br>

        Eres la calma que aparece cuando todo en mí hace ruido.<br>
        Amo cada cosa de ti, cada detalle, cada momento contigo.<br><br>

        No necesito nada más, si te tengo a ti.<br>
        Eres lo mejor de mi vida ❤️<br><br>

        TE AMOO 💖<br><br>

        ATT: tu negro
        </p>

        <button class="menu-btn" onclick="cargarPagina2()">Volver 🔙</button>
    </div>

    <div class="carousel slide">
        <img src="foto7.jpg" class="active">
        <img src="foto8.jpg">
        <img src="foto9.jpg">
    </div>

    <div class="teamo">TE AMO 💖</div>
    `;
    iniciarCarrusel();
}

/* Carrusel */
function iniciarCarrusel() {
    let index = 0;
    const imagenes = document.querySelectorAll(".carousel img");

    setInterval(() => {
        imagenes[index].classList.remove("active");
        index = (index + 1) % imagenes.length;
        imagenes[index].classList.add("active");
    }, 3000);
}

/* Corazones */
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
